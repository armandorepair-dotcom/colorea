<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Vocales: Pinta por Letra</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VocalesPWA">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --bg-color: #F4F7F6;
      --card-bg: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
    }

    h1 {
      margin-bottom: 5px;
      color: #2C3E50;
    }

    p.instruccion {
      margin-top: 0;
      font-size: 1.05rem;
      color: #555;
    }

    .selector-container {
      margin-bottom: 15px;
    }

    select {
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid #4A90E2;
      outline: none;
      background-color: white;
      cursor: pointer;
    }

    .main-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 650px;
      width: 100%;
    }

    .svg-container {
      width: 100%;
      max-width: 500px;
      height: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px dashed #CBD5E1;
      border-radius: 12px;
      padding: 10px;
      background-color: #FAFAFA;
      user-select: none;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .zona-coloreable {
      cursor: pointer;
      transition: fill 0.4s ease, filter 0.2s ease;
      stroke: #222222;
      stroke-width: 2px;
      fill: #FFFFFF;
    }

    .zona-coloreable:hover {
      filter: brightness(0.95);
    }

    .texto-vocal {
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 14px;
      fill: #444444;
      pointer-events: none;
      user-select: none;
    }

    .paleta-vocales {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-vocal {
      width: 65px;
      height: 65px;
      font-size: 1.8rem;
      font-weight: bold;
      border: 4px solid transparent;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .btn-vocal:hover {
      transform: scale(1.08);
    }

    .btn-vocal.activo {
      border-color: #222222;
      transform: scale(1.12);
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }

    .btn-a { background-color: #FFD700; color: #333; }
    .btn-e { background-color: #FF69B4; }
    .btn-i { background-color: #32CD32; }
    .btn-o { background-color: #FF4500; }
    .btn-u { background-color: #1E90FF; }

    @keyframes errorShake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    .error-anim {
      animation: errorShake 0.4s ease;
    }

    .reset-btn {
      margin-top: 20px;
      padding: 9px 18px;
      background-color: #78909C;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .reset-btn:hover {
      background-color: #546E7A;
    }
  </style>
</head>
<body>

  <h1>Colorea por Letra</h1>
  <p class="instruccion">1. Selecciona una vocal. 2. Haz clic en las áreas con la misma letra.</p>

  <div class="selector-container">
    <label for="imagen-select"><strong>Elegir figura:</strong> </label>
    <select id="imagen-select" onchange="cargarDibujo()">
      <option value="flores">Flores</option>
      <option value="saturno">Saturno</option>
      <option value="tucan">Tucán</option>
    </select>
  </div>

  <div class="main-card">
    <div class="svg-container" id="svg-holder"></div>

    <div class="paleta-vocales">
      <button class="btn-vocal btn-a activo" onclick="seleccionarVocal('A', this)">A</button>
      <button class="btn-vocal btn-e" onclick="seleccionarVocal('E', this)">E</button>
      <button class="btn-vocal btn-i" onclick="seleccionarVocal('I', this)">I</button>
      <button class="btn-vocal btn-o" onclick="seleccionarVocal('O', this)">O</button>
      <button class="btn-vocal btn-u" onclick="seleccionarVocal('U', this)">U</button>
    </div>

    <button class="reset-btn" onclick="cargarDibujo()">Reiniciar dibujo</button>
  </div>

  <script>
    const coloresVocales = {
      'A': '#FFD700',
      'E': '#FF69B4',
      'I': '#32CD32',
      'O': '#FF4500',
      'U': '#1E90FF'
    };

    let vocalSeleccionada = 'A';

    const plantillasSVG = {
      flores: `
        <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
          <path class="zona-coloreable" data-vocal="O" d="M10,180 Q150,160 290,180 L290,195 L10,195 Z" />
          <text x="150" y="190" class="texto-vocal">O</text>

          <path class="zona-coloreable" data-vocal="I" d="M60,180 Q50,130 65,90 Q70,130 65,180" />
          <path class="zona-coloreable" data-vocal="I" d="M150,180 Q140,120 150,75" />
          <path class="zona-coloreable" data-vocal="I" d="M235,180 Q240,140 235,100" />
          <text x="55" y="140" class="texto-vocal">I</text>
          <text x="142" y="130" class="texto-vocal">I</text>
          <text x="242" y="140" class="texto-vocal">I</text>

          <g class="zona-coloreable" data-vocal="E">
            <circle cx="65" cy="40" r="12" />
            <circle cx="40" cy="65" r="12" />
            <circle cx="90" cy="65" r="12" />
            <circle cx="65" cy="90" r="12" />
          </g>
          <text x="61" y="32" class="texto-vocal">E</text>

          <circle class="zona-coloreable" data-vocal="A" cx="65" cy="65" r="15" />
          <text x="60" y="70" class="texto-vocal">A</text>

          <circle class="zona-coloreable" data-vocal="A" cx="150" cy="70" r="32" stroke-dasharray="3 3" />
          <text x="145" y="75" class="texto-vocal">A</text>

          <g class="zona-coloreable" data-vocal="E">
            <circle cx="235" cy="65" r="15" />
            <circle cx="210" cy="90" r="15" />
            <circle cx="260" cy="90" r="15" />
          </g>
          <text x="231" y="55" class="texto-vocal">E</text>

          <circle class="zona-coloreable" data-vocal="U" cx="235" cy="90" r="13" />
          <text x="230" y="95" class="texto-vocal">U</text>
        </svg>
      `,
      saturno: `
        <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
          <path class="zona-coloreable" data-vocal="U" d="M 20,100 C 20,60 280,60 280,100 C 280,115 240,125 200,128 C 220,118 240,105 240,100 C 240,80 60,80 60,100 C 60,105 80,118 100,128 C 60,125 20,115 20,100 Z" />
          <text x="145" y="75" class="texto-vocal">U</text>

          <circle class="zona-coloreable" data-vocal="A" cx="150" cy="100" r="65" />
          <text x="145" y="55" class="texto-vocal">A</text>

          <path class="zona-coloreable" data-vocal="E" d="M 88,80 Q 150,100 212,80 Q 214,88 214,92 Q 150,112 86,92 Z" />
          <text x="145" y="90" class="texto-vocal">E</text>

          <path class="zona-coloreable" data-vocal="I" d="M 86,110 Q 150,130 214,110 Q 211,120 205,128 Q 150,145 95,128 Z" />
          <text x="145" y="122" class="texto-vocal">I</text>

          <path class="zona-coloreable" data-vocal="O" d="M 20,100 C 20,140 280,140 280,100 C 280,120 220,145 150,145 C 80,145 20,120 20,100 Z" />
          <text x="145" y="140" class="texto-vocal">O</text>
        </svg>
      `,
      tucan: `
        <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
          <path class="zona-coloreable" data-vocal="O" d="M 190,70 C 200,40 230,30 240,50 C 220,70 210,80 190,70 Z" />
          <text x="215" y="50" class="texto-vocal">O</text>

          <path class="zona-coloreable" data-vocal="A" d="M 180,80 C 220,50 280,30 280,70 C 250,110 200,120 180,80 Z" />
          <path class="zona-coloreable" data-vocal="A" d="M 110,80 C 130,50 180,60 190,90 C 200,140 150,170 110,140 C 90,120 90,90 110,80 Z" />
          <text x="230" y="80" class="texto-vocal">A</text>
          <text x="150" y="130" class="texto-vocal">A</text>

          <path class="zona-coloreable" data-vocal="E" d="M 110,80 C 140,90 140,130 110,140 C 95,120 95,95 110,80 Z" />
          <text x="115" y="115" class="texto-vocal">E</text>

          <circle class="zona-coloreable" data-vocal="U" cx="105" cy="85" r="14" />
          <circle cx="105" cy="85" r="5" fill="#333" />
          <text x="101" y="66" class="texto-vocal">U</text>

          <path class="zona-coloreable" data-vocal="I" d="M 95,75 C 60,60 20,90 20,110 C 50,105 80,100 95,95 Z" />
          <text x="60" y="90" class="texto-vocal">I</text>

          <path class="zona-coloreable" data-vocal="O" d="M 20,110 C 20,90 35,80 45,82 C 38,98 30,105 20,110 Z" />
          <text x="30" y="98" class="texto-vocal">O</text>
        </svg>
      `
    };

    function seleccionarVocal(vocal, elemento) {
      vocalSeleccionada = vocal;
      document.querySelectorAll('.btn-vocal').forEach(b => b.classList.remove('activo'));
      elemento.classList.add('activo');
      pronunciarVocal(vocal);
    }

    function cargarDibujo() {
      const opcion = document.getElementById('imagen-select').value;
      const contenedor = document.getElementById('svg-holder');
      contenedor.innerHTML = plantillasSVG[opcion];

      const zonas = contenedor.querySelectorAll('.zona-coloreable');
      zonas.forEach(zona => {
        zona.addEventListener('click', intentarPintar);
      });
    }

    function intentarPintar(e) {
      const elemento = e.currentTarget;
      const vocalRequerida = elemento.getAttribute('data-vocal');

      if (vocalRequerida === vocalSeleccionada) {
        elemento.style.fill = coloresVocales[vocalSeleccionada];
        pronunciarVocal(vocalSeleccionada);
      } else {
        const contenedor = document.getElementById('svg-holder');
        contenedor.classList.remove('error-anim');
        void contenedor.offsetWidth;
        contenedor.classList.add('error-anim');
      }
    }

    function pronunciarVocal(vocal) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const mensaje = new SpeechSynthesisUtterance(vocal);
        mensaje.lang = 'es-MX';
        mensaje.rate = 0.9;
        window.speechSynthesis.speak(mensaje);
      }
    }

    window.onload = cargarDibujo;

    // Registro del Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch(err => console.error('Error al registrar el Service Worker:', err));
      });
    }
  </script>
</body>
</html>
